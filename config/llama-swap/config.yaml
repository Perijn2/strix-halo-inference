# Author: Perijn
# Summary: Keeps every Strix Halo inference model concurrently available and exposes role-specific model IDs without runtime profile switching.
# Usage: Caddy forwards API requests to llama-swap. llama-swap preloads every model and retains it until explicitly unloaded.
apiKeys: []

globalTTL: 0
unloadTimeout: 60

hooks:
  on_startup:
    preload:
      - qwen3.8-flash-next
      - ornith-1.5-35b-a3b
      - qwen3-embedding-4b
      - bge-reranker-v2-m3

routing:
  router:
    use: matrix
    settings:
      matrix:
        vars:
          q: qwen3.8-flash-next
          o: ornith-1.5-35b-a3b
          e: qwen3-embedding-4b
          r: bge-reranker-v2-m3
          x: ocr-ensemble
        evict_costs:
          q: 100
          o: 20
          e: 10
          r: 10
          # This cost applies only to the supervised socat forwarder. The OCR
          # models themselves live in the memory-capped sidecar container.
          x: 100
        # One complete set permits all llama-swap children and the OCR forwarder
        # to remain loaded and serve requests concurrently.
        sets:
          all-models: "q & o & e & r & x"

models:
  qwen3.8-flash-next:
    name: Qwen3.8 Flash Next
    description: Halogen-managed orchestrator, architect, planner, and reviewer model.
    cmd: |
      HALOGEN_API_PORT=${PORT} halogen-launch all
    checkEndpoint: /health
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      tools: true
      # Each request is limited by one HALOGEN_CTX slot; the 262K pool is shared across two slots.
      context: 131072
    # llama-swap's native capabilities schema has no reasoning property. These
    # fields are valid model metadata published through /v1/models.
    metadata:
      reasoning: true
      reasoning_levels: [low, medium, high, xhigh]
      reasoning_level_parameter: reasoning_effort
    filters:
      # Qwen official thinking-mode defaults. DSH can override either
      # enable_thinking or reasoning_effort on the base model request.
      setParams:
        enable_thinking?: true
        reasoning_effort?: high
        temperature?: 1.0
        top_p?: 0.95
        top_k?: 20
        min_p?: 0.0
        presence_penalty?: 0.0
        repetition_penalty?: 1.0
      # Preserve the stable agent-role endpoints without exposing Qwen effort
      # variants as separate general-purpose models.
      setParamsByID:
        role/orchestrator:
          enable_thinking: true
          reasoning_effort: high
        role/architect:
          enable_thinking: true
          reasoning_effort: high
        role/reviewer:
          enable_thinking: true
          reasoning_effort: high
        role/general:
          enable_thinking: false
          reasoning_effort: low
          temperature: 0.7
          top_p: 0.80
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repetition_penalty: 1.0

  ornith-1.5-35b-a3b:
    name: Ornith 1.5 35B A3B
    description: Reasoning model for implementation, testing, and documentation.
    cmd: |
      llama-server
      --host 127.0.0.1 --port ${PORT}
      --model /models/ornith/Ornith-1.5-35B-A3B-Q4_0_ROCMFP4_STRIX_LEAN.gguf
      --alias ornith-1.5-35b-a3b
      --jinja --flash-attn on --n-gpu-layers 999
      --ctx-size 65536 --parallel 2
    env:
      - "GGML_VK_DENSE_WAVE32=1"
    checkEndpoint: /health
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 65536
    metadata:
      reasoning: true
    filters:
      setParams:
        enable_thinking?: true
        temperature?: 0.6
        top_p?: 0.95
        top_k?: 20
      setParamsByID:
        role/implementer:
          enable_thinking: true
        role/tester:
          enable_thinking: true
        role/documenter:
          enable_thinking: false

  qwen3-embedding-4b:
    name: Qwen3 Embedding 4B
    description: Persistent high-quality retrieval embedding model.
    cmd: |
      llama-server \
        --host 127.0.0.1 --port ${PORT} \
        --model /models/qwen3-embedding/Qwen3-Embedding-4B-Q6_K.gguf \
        --alias qwen3-embedding-4b \
        --embedding --pooling mean --n-gpu-layers 999 \
        --ctx-size 8192 --batch-size 2048 --ubatch-size 512
    checkEndpoint: /health
    ttl: 0
    aliases: [role/embed]
    capabilities:
      in: [text]
      out: [text]
      context: 8192

  bge-reranker-v2-m3:
    name: BGE Reranker v2 M3
    description: Persistent multilingual cross-encoder reranker.
    cmd: |
      llama-server \
        --host 127.0.0.1 --port ${PORT} \
        --model /models/bge-reranker/bge-reranker-v2-m3-Q8_0.gguf \
        --alias bge-reranker-v2-m3 \
        --reranking --n-gpu-layers 999 \
        --ctx-size 8192
    checkEndpoint: /health
    ttl: 0
    aliases: [role/rerank]
    capabilities:
      in: [text]
      out: [text]
      reranker: true
      context: 8192

  # This is a genuine llama-swap child process, not a pretend remote model: the
  # supervised local forwarder owns ${PORT} and relays to the isolated Python
  # sidecar. Unload kills the forwarder but intentionally never destroys its
  # pre-warmed sidecar, which has its own 12 GiB container memory boundary.
  ocr-ensemble:
    name: OCR ensemble
    description: MinerU primary parser validated by PP-OCRv5, Tesseract, and Surya with consensus-entropy review routing.
    cmd: |
      exec socat TCP-LISTEN:${PORT},fork,reuseaddr TCP:ocr-ensemble:8090
    checkEndpoint: /health
    ttl: 0
    aliases: [role/ocr]
    capabilities:
      in: [image]
      out: [text]
    metadata:
      audit_endpoint: /ocr
      fusion: consensus-entropy
      primary: MinerU2.5-Pro-2605-1.2B