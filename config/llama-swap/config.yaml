# Author: Perijn
# Summary: Routes Strix Halo inference models through stable role-specific IDs without runtime profile switching.
# Usage: Caddy forwards API requests to llama-swap. Models start on their first request and remain until explicitly unloaded.
apiKeys: []

globalTTL: 0
unloadTimeout: 60

# Models start lazily on their first request. Individual ``ttl: 0`` settings
# keep successfully loaded models resident until an explicit unload request.

# No routing profiles, groups, or swap matrix are configured. llama-swap may
# therefore keep every child resident simultaneously after lazy first-request
# startup, while ttl: 0 prevents either from being evicted by idleness.

models:
  qwen3.8-flash-next:
    name: Qwen3.8 Flash Next
    description: Halogen-managed orchestrator, architect, planner, and reviewer model.
    cmd: |
      env HALOGEN_API_PORT=${PORT} halogen-launch all
    checkEndpoint: /health
    ttl: 0
    capabilities:
      in: [text]
      out: [text]
      tools: true
      # Each request is limited by one HALOGEN_CTX slot; the 262K pool is shared across two slots.
      context: 131072
    # llama-swap's native capabilities schema has no reasoning property. These
    # fields are valid model metadata published through /v1/models.
    metadata:
      reasoning: true
      reasoning_levels: [low, medium, high, xhigh]
      reasoning_level_parameter: reasoning_effort
    filters:
      # Qwen official thinking-mode defaults. DSH can override either
      # enable_thinking or reasoning_effort on the base model request.
      setParams:
        enable_thinking?: true
        reasoning_effort?: high
        temperature?: 1.0
        top_p?: 0.95
        top_k?: 20
        min_p?: 0.0
        presence_penalty?: 0.0
        repetition_penalty?: 1.0
      # Preserve the stable agent-role endpoints without exposing Qwen effort
      # variants as separate general-purpose models.
      setParamsByID:
        role/orchestrator:
          enable_thinking: true
          reasoning_effort: high
        role/architect:
          enable_thinking: true
          reasoning_effort: high
        role/reviewer:
          enable_thinking: true
          reasoning_effort: high
        role/general:
          enable_thinking: false
          reasoning_effort: low
          temperature: 0.7
          top_p: 0.80
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repetition_penalty: 1.0

  ciru-ornith-1.5-halo-agent:
    name: Ornith 1.5 Ciru Halo Agent
    description: Ciru's Strix-Halo-specific packed Ornith runtime for implementation, testing, and documentation.
    # This checkpoint is incompatible with llama.cpp and stock vLLM. The mounted
    # release includes its pinned runtime, custom kernels, DFlash2 drafter, and
    # launcher; preserve its supplied serving configuration.
    cmd: |
      # IU4 prefill requires the release's coupled agents64k configuration.
      # Do not override its context, cache, or sequence settings here.
      bash /ornith/bundle/serve.sh --host 127.0.0.1 --port ${PORT}
    checkEndpoint: /health
    # Cold load (pinned torch.compile + ~53s warmup + CUDA-graph capture)
    # exceeds llama-swap's 120s default; without this larger window the router
    # kills the engine mid-capture with no traceback. See docs/operations.md.
    healthCheckTimeout: 900
    ttl: 0
    aliases: [ornith-1.5-35b-a3b]
    capabilities:
      in: [text]
      out: [text]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      runtime: ciru-vllm-rocm
      served_model: ciru-halo-agent
      max_sequences: 8
      shared_kv_state_pool_gib: 44
    filters:
      setParams:
        enable_thinking?: true
        temperature?: 0.6
        top_p?: 0.95
        top_k?: 20
      setParamsByID:
        # Thinking uses the model's recommended moderate sampling settings to
        # preserve reasoning and tool-use reliability.
        role/implementer:
          enable_thinking: true
          temperature: 0.6
          top_p: 0.95
          top_k: 20
        role/tester:
          enable_thinking: true
          temperature: 0.6
          top_p: 0.95
          top_k: 20
        # Direct instruct mode is tightly constrained to favor clear,
        # repeatable documentation over exploratory reasoning.
        role/documenter:
          enable_thinking: false
          temperature: 0.4
          top_p: 0.80
          top_k: 20

  qwen3-embedding-4b:
    name: Qwen3 Embedding 4B
    description: Persistent high-quality retrieval embedding model.
    cmd: |
      llama-server \
        --host 127.0.0.1 --port ${PORT} \
        --model /models/qwen3-embedding/Qwen3-Embedding-4B-Q6_K.gguf \
        --alias qwen3-embedding-4b \
        --embedding --pooling mean --n-gpu-layers 999 \
        --ctx-size 8192 --batch-size 2048 --ubatch-size 512
    checkEndpoint: /health
    ttl: 0
    aliases: [role/embed]
    capabilities:
      in: [text]
      out: [text]
      context: 8192

  bge-reranker-v2-m3:
    name: BGE Reranker v2 M3
    description: Persistent multilingual cross-encoder reranker.
    cmd: |
      llama-server \
        --host 127.0.0.1 --port ${PORT} \
        --model /models/bge-reranker/bge-reranker-v2-m3-Q8_0.gguf \
        --alias bge-reranker-v2-m3 \
        --reranking --n-gpu-layers 999 \
        --ctx-size 8192
    checkEndpoint: /health
    ttl: 0
    aliases: [role/rerank]
    capabilities:
      in: [text]
      out: [text]
      reranker: true
      context: 8192

  # This is a genuine llama-swap child process, not a pretend remote model: the
  # supervised local forwarder owns ${PORT} and relays to the isolated Python
  # sidecar. Unload kills the forwarder but intentionally never destroys its
  # pre-warmed sidecar, which has its own 12 GiB container memory boundary.
  ocr-ensemble:
    name: OCR ensemble
    description: MinerU primary parser validated by PP-OCRv5, Tesseract, and Surya with consensus-entropy review routing.
    cmd: |
      exec socat TCP-LISTEN:${PORT},fork,reuseaddr TCP:ocr-ensemble:8090
    checkEndpoint: /health
    ttl: 0
    aliases: [role/ocr]
    capabilities:
      in: [image]
      out: [text]
    metadata:
      audit_endpoint: /ocr
      fusion: consensus-entropy
      primary: MinerU2.5-Pro-2605-1.2B