# Author: Perijn
# Summary: Routes all inference roles through llama-swap while preserving Qwen and retrieval availability.
# Usage: Caddy sends every API request here. Activate a profile with PUT /api/profiles/active and request its stable role IDs.
# Qwen is a permanently running Halogen peer; local retrieval processes preload and remain loaded after their first startup.
apiKeys: []

globalTTL: 0
unloadTimeout: 30

hooks:
  on_startup:
    profile: orchestration
    preload: [qwen3-embedding-4b, bge-reranker-v2-m3]

routing:
  router:
    use: group
    settings:
      groups:
        retrieval:
          members: [qwen3-embedding-4b, bge-reranker-v2-m3]
          persistent: true
          swap: false
          exclusive: false
        ornith:
          members: [ornith-1.5-35b-a3b]
          swap: true
          exclusive: false

models:
  ornith-1.5-35b-a3b:
    name: Ornith 1.5 35B A3B
    description: Implementation, testing, and documentation model.
    cmd: |
      llama-server
      --host 127.0.0.1 --port ${PORT}
      --model /models/ornith/Ornith-1.5-35B-Q4_K_M.gguf
      --alias ornith-1.5-35b-a3b
      --jinja --flash-attn on --n-gpu-layers 999
      --ctx-size 65536 --parallel 2
    checkEndpoint: /health
    ttl: 0
    filters:
      setParamsByID:
        "${MODEL_ID}:think":
          enable_thinking: true
        "${MODEL_ID}:fast":
          enable_thinking: false

  qwen3-embedding-4b:
    name: Qwen3 Embedding 4B
    description: Persistent high-quality retrieval embedding model.
    cmd: |
      llama-server
      --host 127.0.0.1 --port ${PORT}
      --model /models/qwen3-embedding/Qwen3-Embedding-4B-Q6_K.gguf
      --alias qwen3-embedding-4b
      --embedding --pooling mean --n-gpu-layers 999
      --ctx-size 8192 --batch-size 2048 --ubatch-size 512
    checkEndpoint: /health
    ttl: 0

  bge-reranker-v2-m3:
    name: BGE Reranker v2 M3
    description: Persistent multilingual cross-encoder reranker.
    cmd: |
      llama-server
      --host 127.0.0.1 --port ${PORT}
      --model /models/bge-reranker/bge-reranker-v2-m3-Q8_0.gguf
      --alias bge-reranker-v2-m3
      --reranking --n-gpu-layers 999
      --ctx-size 8192
    checkEndpoint: /health
    ttl: 0

peers:
  qwen-thinking:
    proxy: http://halogen:8731
    models: [qwen3.8-flash-next]
    timeouts:
      connect: 30
      responseHeader: 1200
      idleConn: 90
    filters:
      setParams:
        enable_thinking: true
        reasoning_effort: high

  qwen-fast:
    proxy: http://halogen:8731
    models: [qwen3.8-flash-next]
    timeouts:
      connect: 30
      responseHeader: 1200
      idleConn: 90
    filters:
      setParams:
        enable_thinking: false
        reasoning_effort: low

profiles:
  orchestration:
    description: Qwen plans, reviews, and orchestrates while retrieval remains available.
    pins:
      role/orchestrator: qwen-thinking/qwen3.8-flash-next
      role/architect: qwen-thinking/qwen3.8-flash-next
      role/reviewer: qwen-thinking/qwen3.8-flash-next
      role/general: qwen-fast/qwen3.8-flash-next
      role/embed: qwen3-embedding-4b
      role/rerank: bge-reranker-v2-m3
      role/implementer: ~
      role/tester: ~
      role/documenter: ~

  engineering:
    description: Ornith implements, tests, and documents while retrieval remains available.
    pins:
      role/orchestrator: ~
      role/architect: ~
      role/reviewer: ~
      role/general: ornith-1.5-35b-a3b:fast
      role/implementer: ornith-1.5-35b-a3b:think
      role/tester: ornith-1.5-35b-a3b:think
      role/documenter: ornith-1.5-35b-a3b:fast
      role/embed: qwen3-embedding-4b
      role/rerank: bge-reranker-v2-m3
