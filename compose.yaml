# Author: Perijn
# Summary: Runs the Strix Halo inference gateway, the llama-swap router for Halogen, Ciru Ornith, and the retrieval models, plus the PostgreSQL store that backs RAG and telemetry.
# Usage: Copy .env.example to .env, configure model directories and host group IDs, run scripts/download-models.sh, then run `docker compose up -d`.
# Core principle: Caddy exposes only llama-swap; llama-swap owns stable role IDs.
# Setup: Download the model artifacts before starting. Qwen, Ciru Ornith, and the retrieval models are resident at the same time, so read the host-memory guidance in docs/operations.md before adding workloads.
# Workflow: Send chat, embedding, and rerank requests to stable role IDs through Caddy; llama-swap loads each model on its first routed request and keeps it loaded until an explicit unload.
# API guide: /v1/models lists role IDs. /v1/chat/completions, /v1/embeddings, and /v1/rerank are all routed by role.
# Worked example: `docker compose up -d`, then POST an OpenAI chat message with `model: role/orchestrator` to Caddy.
services:
  # Summary: HTTP-only LAN edge proxy that forwards inference requests.
  # Notes: This gateway has no application authentication; restrict the published port with a host firewall or private LAN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      llama-swap:
        condition: service_healthy
    networks: [edge, inference]

  # Summary: Single public inference router and lifecycle owner for Halogen, Ciru Ornith, and the llama.cpp retrieval models.
  llama-swap:
    image: strix-halo/llama-swap-halogen:local
    build:
      context: .
      dockerfile: docker/llama-swap-halogen/Dockerfile
    restart: unless-stopped
    # Docker's 10s default stop window can cut off prompt-cache state that is still
    # being written behind a long request. 60s matches the upstream bundled compose
    # and keeps a restart from throwing away cache that was about to land.
    stop_grace_period: 60s
    command:
      - -config
      - /etc/llama-swap/config/config.yaml
      - -listen
      - 0.0.0.0:8080
      - -watch-config
    environment:
      HALOGEN_MODEL_ID: qwen3.8-flash-next
      HALOGEN_CHECKPOINT: /halogen-models/qwen38-flash-next-w4b.hgn
      HALOGEN_KV_SLOTS: "2"
      HALOGEN_CTX: "131072"
      HALOGEN_KV_POOL_POSITIONS: "262144"
      HALOGEN_HOST_RESERVE_GIB: "${HALOGEN_HOST_RESERVE_GIB:-28}"
      HALOGEN_PROMPT_CACHE: "2"
      # The prompt cache persists to disk so a conversation survives a server restart.
      # Each turn's new state is written behind the request, so nothing on the request
      # path waits for the drive, and a conversation no longer resident in memory is
      # restored from disk byte-identically to the in-memory resume. That is what
      # makes a restart cheap: a warm conversation comes back in seconds instead of
      # paying a full re-prefill. Plan on about 27 KiB per cached token, bounded by
      # HALOGEN_CACHE_DISK_GIB, which drops least-recently-used conversations first.
      # This must be a filesystem that accepts direct I/O. A tmpfs or an overlay is
      # refused and the cache silently stays in memory only, which still works but
      # buys nothing, so this is a named volume on real host storage rather than a
      # tmpfs mount. Every build, weights file, and setting keeps its own files and
      # never restores another's, so changing the checkpoint invalidates the cache
      # rather than poisoning it.
      HALOGEN_CACHE_DIR: /halogen-cache
      HALOGEN_CACHE_DISK_GIB: "${HALOGEN_CACHE_DISK_GIB:-64}"
      # Vision is on, and the version bump is what allows it. 0.10.1 fixed the stale
      # image-position table that made a text turn inherit the previous image turn's
      # positions on a cache hit, but that fix freed the table's buffer while keeping
      # its size, so the next image on a slot that had carried one reused freed memory
      # and took the engine down (upstream #62) on the order text -> image -> text ->
      # image. Any client that sends a chat title or a summary between image turns
      # produces exactly that order.
      # Measured upstream end to end, one image costs 5.5s at 1280x800, 11.8s at
      # 1080p, and 25.3s at 1440p; 4K costs 105.8s and reads no better than 1440p,
      # which is why HALOGEN_VISION_MAX_PIXELS keeps its 3686400 (2560x1440) default
      # rather than being raised. The tower is additional resident weight on the same
      # unified memory the KV pool draws from; HALOGEN_DMALLOC_LOG=1 prints every
      # device allocation over 64 MB with a running total at startup, so the cost can
      # be measured on this host rather than guessed at.
      # Images arrive only as a data: URL or bare base64 -- the server refuses http(s)
      # by design so it never makes an outbound request on a client's say-so -- and
      # Caddy's 32 MB request-body cap bounds the encoded image. The sidecar must be
      # present on the host before start, since the models mount is read-only and the
      # entrypoint cannot fetch it itself; scripts/validate.sh gates on it.
      HALOGEN_VISION_TOWER: "1"
      # The Ciru launcher reads this location through bundle/paths.env. It must
      # contain the release's installed-runtime directory created by its installer.
      ORNITH_RUNTIME_ROOT: /ornith/installed-runtime
      # Naming contract: the Ciru release answers to one served name, so the
      # sidecar in front of serve.sh maps these llama-swap IDs onto it and gives
      # each caller its own ID back. Widen the list without a rebuild by setting
      # CIRU_MODEL_ALIASES in .env; see docs/operations.md.
      CIRU_SERVED_MODEL: "${CIRU_SERVED_MODEL:-ciru-halo-agent}"
      CIRU_MODEL_ALIASES: "${CIRU_MODEL_ALIASES:-role/implementer,role/tester,role/documenter,ornith-1.5-35b-a3b}"
      CIRU_SERVE_SCRIPT: "${CIRU_SERVE_SCRIPT:-bash /ornith/bundle/serve.sh}"
    volumes:
      - ./config/llama-swap/config.yaml:/etc/llama-swap/config/config.yaml:ro
      - ${MODELS_DIR:?set MODELS_DIR in .env}:/models:ro
      - ${HALOGEN_MODELS_DIR:?set HALOGEN_MODELS_DIR in .env}:/halogen-models:ro
      # The complete vendor release includes the launcher, runtime, kernels, and weights.
      - ${ORNITH_MODEL_DIR:?set ORNITH_MODEL_DIR in .env}:/ornith:ro
      # uv-backed Ciru venvs use an absolute interpreter symlink; preserve that
      # target path in the container without exposing the rest of the host home.
      - ${ORNITH_RUNTIME_PYTHON_ROOT:?run scripts/download-models.sh to set ORNITH_RUNTIME_PYTHON_ROOT}:${ORNITH_RUNTIME_PYTHON_ROOT}:ro
      # Ciru builds GPU/runtime artifacts here on first start; keep release files immutable.
      - ornith_cache:/ornith/bundle/cache
      # Writable home for the persistent Halogen prompt cache. Deliberately a named
      # volume and not a tmpfs: the cache needs direct I/O and it has to outlive the
      # container, which is the entire point.
      - halogen_cache:/halogen-cache
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:?run scripts/generate-secrets.sh to set RENDER_GID}"
      - "${VIDEO_GID:?run scripts/generate-secrets.sh to set VIDEO_GID}"
    security_opt: [seccomp:unconfined]
    ipc: host
    ulimits:
      memlock: -1
    networks: [inference]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8080/health'', timeout=3)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Summary: Durable PostgreSQL store for RAG vectors and telemetry metadata; it does not participate in model routing.
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inference}
      POSTGRES_USER: ${POSTGRES_USER:-inference}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init/001-enable-pgvector.sql:/docker-entrypoint-initdb.d/001-enable-pgvector.sql:ro
    networks: [inference]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge: {}
  # Summary: Internal-only network for container-to-container inference traffic; it has no route to the outside world.
  inference:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  # Writable Ciru first-start cache overlaid on the otherwise read-only release.
  ornith_cache: {}
  # Persistent Halogen prompt cache. Grows to HALOGEN_CACHE_DISK_GIB at most, with
  # least-recently-used conversations dropped past that. Safe to delete: it costs
  # cold-prefill time, never correctness.
  halogen_cache: {}
  postgres_data: {}

secrets:
  # Summary: Root-only PostgreSQL password, read from the host secrets directory and mounted into the database container.
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?set POSTGRES_PASSWORD_FILE in .env}
